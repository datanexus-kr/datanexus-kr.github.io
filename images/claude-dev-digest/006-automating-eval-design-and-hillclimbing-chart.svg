<text x="405.0" y="514" font-size="16" fill="#78716c" text-anchor="middle">25%</text>
<line x1="480.0" y1="150" x2="480.0" y2="488" stroke="#e7e5e4" stroke-width="1"/>
<text x="480.0" y="514" font-size="16" fill="#78716c" text-anchor="middle">50%</text>
<line x1="555.0" y1="150" x2="555.0" y2="488" stroke="#e7e5e4" stroke-width="1"/>
<text x="555.0" y="514" font-size="16" fill="#78716c" text-anchor="middle">75%</text>
<line x1="630.0" y1="150" x2="630.0" y2="488" stroke="#e7e5e4" stroke-width="1"/>
<text x="630.0" y="514" font-size="16" fill="#78716c" text-anchor="middle">100%</text>
<line x1="770.0" y1="150" x2="770.0" y2="488" stroke="#a8a29e" stroke-width="2"/>
<text x="770.0" y="514" font-size="16" fill="#78716c" text-anchor="middle">0¢</text>
<line x1="830.0" y1="150" x2="830.0" y2="488" stroke="#e7e5e4" stroke-width="1"/>
<text x="830.0" y="514" font-size="16" fill="#78716c" text-anchor="middle">1¢</text>
<line x1="890.0" y1="150" x2="890.0" y2="488" stroke="#e7e5e4" stroke-width="1"/>
<text x="890.0" y="514" font-size="16" fill="#78716c" text-anchor="middle">2¢</text>
<line x1="950.0" y1="150" x2="950.0" y2="488" stroke="#e7e5e4" stroke-width="1"/>
<text x="950.0" y="514" font-size="16" fill="#78716c" text-anchor="middle">3¢</text>
<line x1="1010.0" y1="150" x2="1010.0" y2="488" stroke="#e7e5e4" stroke-width="1"/>
<text x="1010.0" y="514" font-size="16" fill="#78716c" text-anchor="middle">4¢</text>
<line x1="1070.0" y1="150" x2="1070.0" y2="488" stroke="#e7e5e4" stroke-width="1"/>
<text x="1070.0" y="514" font-size="16" fill="#78716c" text-anchor="middle">5¢</text>
<text x="48" y="193" font-size="20" font-weight="700" fill="#1c1917">1. Opus 4.8 · high effort</text>
<text x="48" y="219" font-size="17" fill="#57534e">기본 설정</text>
<rect x="330" y="171" width="223.2" height="38" rx="3" fill="#d97757"/>
<text x="563.2" y="198" font-size="22" font-weight="700" fill="#1c1917">74.4%</text>
