<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770" width="1200" height="770" role="img" aria-labelledby="t d" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">
<title id="t">고객지원 벤치마크 설정별 정확도와 티켓당 비용</title>
<desc id="d">Opus 4.8 high effort 74.4%와 4.6센트, Opus 5.5 low effort 87.8%와 1.9센트, Sonnet 5 low effort 88.9%와 1센트, 프롬프트 개선 후 Sonnet 5 low effort 98.9%와 1센트를 비교한 막대 차트. 시험 티켓 14건은 원래 설정 78.6%, 최종 설정 90.5%.</desc>
<rect width="1200" height="770" rx="16" fill="#faf9f5" stroke="#e7e5e4"/>
<text x="48" y="58" font-size="30" font-weight="700" fill="#1c1917">고객지원 벤치마크: 설정을 바꿀 때 정확도와 비용</text>
<text x="48" y="92" font-size="20" fill="#57534e">티켓 44건 중 탐색 30건 기준 · 막대 길이는 0에서 시작해 값에 비례</text>

<text x="330" y="140" font-size="22" font-weight="700" fill="#1c1917">결정 정확도 (탐색 티켓 30건)</text>
<text x="770" y="140" font-size="22" font-weight="700" fill="#1c1917">티켓당 비용 (센트)</text>
