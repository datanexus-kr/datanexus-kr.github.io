<text x="48" y="304" font-size="17" fill="#57534e">프롬프트 정리 후</text>
<rect x="330" y="256" width="263.4" height="38" rx="3" fill="#d97757"/>
<text x="603.4" y="283" font-size="22" font-weight="700" fill="#1c1917">87.8%</text>
<rect x="770" y="256" width="114.0" height="38" rx="3" fill="#78716c"/>
<text x="894.0" y="283" font-size="22" font-weight="700" fill="#1c1917">1.9¢</text>
<text x="48" y="363" font-size="20" font-weight="700" fill="#1c1917">3. Sonnet 5 · low effort</text>
<text x="48" y="389" font-size="17" fill="#57534e">같은 프롬프트</text>
<rect x="330" y="341" width="266.7" height="38" rx="3" fill="#d97757"/>
<text x="606.7" y="368" font-size="22" font-weight="700" fill="#1c1917">88.9%</text>
<rect x="770" y="341" width="60.0" height="38" rx="3" fill="#78716c"/>
<text x="840.0" y="368" font-size="22" font-weight="700" fill="#1c1917">1¢</text>
<text x="48" y="448" font-size="20" font-weight="700" fill="#1c1917">4. Sonnet 5 · low effort</text>
<text x="48" y="474" font-size="17" fill="#57534e">프롬프트 개선 후</text>
<rect x="330" y="426" width="296.7" height="38" rx="3" fill="#d97757"/>
<text x="636.7" y="453" font-size="22" font-weight="700" fill="#1c1917">98.9%</text>
<rect x="770" y="426" width="60.0" height="38" rx="3" fill="#78716c"/>
<text x="840.0" y="453" font-size="22" font-weight="700" fill="#1c1917">1¢</text>
<line x1="48" y1="559" x2="1152" y2="559" stroke="#e7e5e4" stroke-width="1.5"/>
<text x="48" y="593" font-size="22" font-weight="700" fill="#1c1917">시험 티켓 14건 정확도 (탐색에서 쓰지 않은 티켓)</text>
<text x="48" y="640" font-size="20" fill="#1c1917">원래 설정</text>
<rect x="330" y="615" width="235.8" height="36" rx="3" fill="#78716c"/>
<text x="575.8" y="642" font-size="22" font-weight="700" fill="#1c1917">78.6%</text>
<text x="48" y="692" font-size="20" fill="#1c1917">최종 설정</text>
<rect x="330" y="667" width="271.5" height="36" rx="3" fill="#d97757"/>
<text x="611.5" y="694" font-size="22" font-weight="700" fill="#1c1917">90.5%</text>
<text x="770" y="663" font-size="20" fill="#57534e">최종 설정의 비용은 원래 설정의 약 5분의 1</text>
</svg>
