<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" role="img" aria-label="Cover comparing claude.ai web initial load latency dropping from 3,085 ms to 550 ms">
<rect width="1200" height="630" fill="#1c1917"/>
<rect x="0" y="0" width="14" height="630" fill="#d97757"/>
<text x="70" y="78" font-size="22" font-weight="700" fill="#d97757">claude.dev Digest · 002</text>
<text x="70" y="166" font-size="54" font-weight="700" fill="#fafaf9">Making claude.ai 3x Faster:</text>
<text x="70" y="236" font-size="54" font-weight="700" fill="#fafaf9">Measure It, and Claude Shrinks It</text>
<text x="70" y="292" font-size="24" fill="#a8a29e">How we made claude.ai 3x faster in two weeks</text>
<text x="70" y="364" font-size="20" fill="#a8a29e">claude.ai web initial load, time to interactive input (p75)</text>
<rect x="70" y="384" width="925.5" height="56" rx="4" fill="#57534e"/>
<text x="90" y="421" font-size="24" font-weight="700" fill="#fafaf9">Before: 3,085 ms</text>
<rect x="70" y="462" width="165.0" height="56" rx="4" fill="#d97757"/>
<text x="255.0" y="499" font-size="24" font-weight="700" fill="#d97757">After: 550 ms · 5.6x faster</text>
<text x="70" y="578" font-size="18" fill="#78716c">Bar length is proportional to p75 latency</text>
</svg>
