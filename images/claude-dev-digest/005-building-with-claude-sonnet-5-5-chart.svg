<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" width="1000" height="690" role="img" aria-label="Sonnet 5.5와 Opus 5.5의 100만 토큰당 가격 비교 막대 차트">
  <rect width="1000" height="690" rx="16" fill="#1c1917"/>
  <g font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">
    <text x="40" y="52" font-size="24" font-weight="700" fill="#fafaf9">100만 토큰당 가격 (USD)</text>
    <rect x="620" y="34" width="18" height="18" rx="3" fill="#d97757"/>
    <text x="646" y="50" font-size="18" fill="#d6d3d1">Sonnet 5.5</text>
    <rect x="780" y="34" width="18" height="18" rx="3" fill="#a8a29e"/>
    <text x="806" y="50" font-size="18" fill="#d6d3d1">Opus 5.5</text>

    <!-- scale: 32 px per USD, bars start at x=190 -->
    <g font-size="20" fill="#fafaf9">
      <text x="40" y="112" font-weight="700">입력</text>
      <text x="180" y="136" text-anchor="end" font-size="17" fill="#d6d3d1">Sonnet 5.5</text>
      <rect x="190" y="118" width="64" height="26" rx="3" fill="#d97757"/>
      <text x="264" y="138" font-weight="700">$2</text>
      <text x="180" y="170" text-anchor="end" font-size="17" fill="#d6d3d1">Opus 5.5</text>
      <rect x="190" y="152" width="128" height="26" rx="3" fill="#a8a29e"/>
      <text x="328" y="172" font-weight="700">$4</text>

      <text x="40" y="232" font-weight="700">출력</text>
      <text x="180" y="256" text-anchor="end" font-size="17" fill="#d6d3d1">Sonnet 5.5</text>
      <rect x="190" y="238" width="320" height="26" rx="3" fill="#d97757"/>
      <text x="520" y="258" font-weight="700">$10</text>
      <text x="180" y="290" text-anchor="end" font-size="17" fill="#d6d3d1">Opus 5.5</text>
      <rect x="190" y="272" width="640" height="26" rx="3" fill="#a8a29e"/>
      <text x="840" y="292" font-weight="700">$20</text>

      <text x="40" y="352" font-weight="700">캐시 쓰기 (5분)</text>
      <text x="180" y="376" text-anchor="end" font-size="17" fill="#d6d3d1">Sonnet 5.5</text>
      <rect x="190" y="358" width="80" height="26" rx="3" fill="#d97757"/>
      <text x="280" y="378" font-weight="700">$2.50</text>
      <text x="180" y="410" text-anchor="end" font-size="17" fill="#d6d3d1">Opus 5.5</text>
      <rect x="190" y="392" width="160" height="26" rx="3" fill="#a8a29e"/>
      <text x="360" y="412" font-weight="700">$5</text>

      <text x="40" y="472" font-weight="700">캐시 쓰기 (1시간)</text>
      <text x="180" y="496" text-anchor="end" font-size="17" fill="#d6d3d1">Sonnet 5.5</text>
      <rect x="190" y="478" width="128" height="26" rx="3" fill="#d97757"/>
      <text x="328" y="498" font-weight="700">$4</text>
      <text x="180" y="530" text-anchor="end" font-size="17" fill="#d6d3d1">Opus 5.5</text>
      <rect x="190" y="512" width="256" height="26" rx="3" fill="#a8a29e"/>
      <text x="456" y="532" font-weight="700">$8</text>

      <text x="40" y="592" font-weight="700">캐시 읽기</text>
      <text x="180" y="616" text-anchor="end" font-size="17" fill="#d6d3d1">Sonnet 5.5</text>
      <rect x="190" y="598" width="6.4" height="26" rx="1" fill="#d97757"/>
      <text x="206" y="618" font-weight="700">$0.20</text>
      <text x="180" y="650" text-anchor="end" font-size="17" fill="#d6d3d1">Opus 5.5</text>
      <rect x="190" y="632" width="6.4" height="26" rx="1" fill="#a8a29e"/>
      <text x="206" y="652" font-weight="700">$0.20</text>
    </g>
  </g>
</svg>
