<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d">
  <title id="t">Claude FDE 1편: 4D 프레임워크와 한계 설정</title>
  <desc id="d">위임, 설명, 분별, 책임의 4D 프레임워크와 그 아래 모델 한계 파악, 플랫폼 진입 지점, 작업별 모델 선택 기준을 정리한 커버</desc>
  <rect width="1200" height="630" fill="#1c1917"/>
  <rect x="0" y="0" width="12" height="630" fill="#d97757"/>
  <g font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">
    <text x="72" y="78" font-size="24" fill="#d97757" font-weight="700">Claude Dev 노트 / 011</text>
    <text x="72" y="162" font-size="52" fill="#faf6f1" font-weight="700">FDE는 일반 AI 개발자와</text>
    <text x="72" y="230" font-size="52" fill="#faf6f1" font-weight="700">무엇이 다른가</text>
    <text x="72" y="288" font-size="27" fill="#d97757" font-weight="700">4D 프레임워크, 모델 한계 설정, 플랫폼 진입과 모델 선택</text>

    <!-- 4D cards: width 246, gap 24 -> 72..1128 -->
    <g text-anchor="middle">
      <rect x="72" y="336" width="246" height="118" rx="14" fill="#2a2522" stroke="#6b625a" stroke-width="2"/>
      <text x="195" y="370" font-size="16" fill="#d97757" font-weight="700">01 Delegation</text>
      <text x="195" y="402" font-size="24" fill="#faf6f1" font-weight="700">위임</text>
      <text x="195" y="432" font-size="15" fill="#b8afa6">맡길 일과 직접 할 일 구분</text>

      <rect x="342" y="336" width="246" height="118" rx="14" fill="#2a2522" stroke="#6b625a" stroke-width="2"/>
      <text x="465" y="370" font-size="16" fill="#d97757" font-weight="700">02 Description</text>
      <text x="465" y="402" font-size="24" fill="#faf6f1" font-weight="700">설명</text>
      <text x="465" y="432" font-size="15" fill="#b8afa6">목표와 제약을 명확히 전달</text>

      <rect x="612" y="336" width="246" height="118" rx="14" fill="#2a2522" stroke="#6b625a" stroke-width="2"/>
      <text x="735" y="370" font-size="16" fill="#d97757" font-weight="700">03 Discernment</text>
      <text x="735" y="402" font-size="24" fill="#faf6f1" font-weight="700">분별</text>
      <text x="735" y="432" font-size="15" fill="#b8afa6">결과물과 추론 과정 검증</text>

      <rect x="882" y="336" width="246" height="118" rx="14" fill="#d97757" stroke="#d97757" stroke-width="2"/>
      <text x="1005" y="370" font-size="16" fill="#1c1917" font-weight="700">04 Diligence</text>
      <text x="1005" y="402" font-size="24" fill="#1c1917" font-weight="700">책임</text>
      <text x="1005" y="432" font-size="15" fill="#29211d" font-weight="600">투명성과 최종 품질 보증</text>
    </g>

    <!-- foundation bar -->
    <rect x="72" y="482" width="1056" height="54" rx="10" fill="none" stroke="#d97757" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="600" y="516" font-size="19" fill="#e8a587" text-anchor="middle">코드보다 먼저 세우는 기준: 모델 한계 파악, 플랫폼 진입 지점, 작업별 모델 선택</text>

    <text x="72" y="596" font-size="18" fill="#a89f96">Claude FDE 시리즈 1/6 (Core 4개 과정 핵심)</text>
    <text x="1128" y="596" font-size="18" fill="#a89f96" text-anchor="end">AI Fluency &amp; Model Foundations</text>
  </g>
</svg>
