<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d">
  <title id="t">Rules for Unattended Agent Automations</title>
  <desc id="d">A pipeline where a schedule wakes an agent, reads sources from bookmarks, re-verifies items before posting, and updates the ledger and bookmarks only after Slack confirms delivery</desc>
  <rect width="1200" height="630" fill="#1c1917"/>
  <rect x="0" y="0" width="12" height="630" fill="#d97757"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text x="72" y="78" font-size="24" fill="#d97757" font-weight="700">claude.dev Digest · 009</text>
    <text x="72" y="168" font-size="50" fill="#faf6f1" font-weight="700">Weekday Morning Agent Briefs</text>
    <text x="72" y="238" font-size="50" fill="#faf6f1" font-weight="700">Without Silent Failures</text>
    <text x="72" y="294" font-size="26" fill="#d97757" font-weight="700">Bookmarks · Re-verification · Delivery Checks · Budget Caps</text>

    <!-- pipeline: 5 boxes, width 184, gap 34 -> 72..1128 -->
    <g font-size="20" font-weight="700" text-anchor="middle">
      <rect x="72" y="350" width="184" height="96" rx="12" fill="#2a2522" stroke="#6b625a" stroke-width="2"/>
      <text x="164" y="392" fill="#e8e0d8">Schedule</text>
      <text x="164" y="424" font-size="15" fill="#a89f96" font-weight="400">Weekday morning</text>

      <rect x="290" y="350" width="184" height="96" rx="12" fill="#2a2522" stroke="#6b625a" stroke-width="2"/>
      <text x="382" y="392" fill="#e8e0d8">Read Sources</text>
      <text x="382" y="424" font-size="15" fill="#a89f96" font-weight="400">From bookmark</text>

      <rect x="508" y="350" width="184" height="96" rx="12" fill="#2a2522" stroke="#6b625a" stroke-width="2"/>
      <text x="600" y="392" fill="#e8e0d8">Re-verify</text>
      <text x="600" y="424" font-size="15" fill="#a89f96" font-weight="400">Before posting</text>

      <rect x="726" y="350" width="184" height="96" rx="12" fill="#d97757" stroke="#d97757" stroke-width="2"/>
      <text x="818" y="392" fill="#1c1917">Confirm Post</text>
      <text x="818" y="424" font-size="15" fill="#1c1917" font-weight="400" font-family="Menlo,monospace">ok · ts</text>

      <rect x="944" y="350" width="184" height="96" rx="12" fill="#2a2522" stroke="#6b625a" stroke-width="2"/>
      <text x="1036" y="392" fill="#e8e0d8">Update State</text>
      <text x="1036" y="424" font-size="15" fill="#a89f96" font-weight="400">Ledger · bookmark</text>
    </g>
    <g stroke="#a89f96" stroke-width="3" fill="none">
      <path d="M258 398 H286 M278 390 L286 398 L278 406"/>
      <path d="M476 398 H504 M496 390 L504 398 L496 406"/>
      <path d="M694 398 H722 M714 390 L722 398 L714 406"/>
      <path d="M912 398 H940 M932 390 L940 398 L932 406"/>
    </g>

    <!-- failed read note -->
    <rect x="290" y="482" width="402" height="56" rx="10" fill="none" stroke="#e5534b" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="491" y="516" font-size="17" fill="#ef7d76" text-anchor="middle">Failed source read is not a quiet day</text>
    <path d="M382 446 V480" stroke="#e5534b" stroke-width="2" stroke-dasharray="4 4" fill="none"/>

    <text x="1128" y="604" font-size="20" fill="#a89f96" text-anchor="end">Building effective agent automations</text>
  </g>
</svg>
