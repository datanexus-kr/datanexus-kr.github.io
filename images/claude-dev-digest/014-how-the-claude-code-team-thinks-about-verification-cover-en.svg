<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d">
  <title id="t">How the Claude Code Team Thinks About Verification</title>
  <desc id="d">End-to-end, property, and differential tests produce evidence that humans review instead of diffs, under the rule that a change can never edit the check that judges it</desc>
  <rect width="1200" height="630" fill="#1c1917"/>
  <rect x="0" y="0" width="12" height="630" fill="#d97757"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text x="72" y="78" font-size="24" fill="#d97757" font-weight="700">Claude Dev Notes / 014</text>
    <text x="72" y="168" font-size="52" fill="#faf6f1" font-weight="700">Making Agents Prove</text>
    <text x="72" y="238" font-size="52" fill="#faf6f1" font-weight="700">Their Work With Evidence</text>
    <text x="72" y="294" font-size="26" fill="#d97757" font-weight="700">E2E, Property, and Differential Tests, Plus Checks on the Checkers</text>

    <!-- three test boxes (240 wide, 20 gap) + arrow + evidence box -->
    <g text-anchor="middle">
      <rect x="72" y="346" width="240" height="104" rx="12" fill="#2a2522" stroke="#6b625a" stroke-width="2"/>
      <text x="192" y="374" font-size="14" fill="#d97757" font-weight="700">01</text>
      <text x="192" y="406" font-size="22" fill="#e8e0d8" font-weight="700">E2E Tests</text>
      <text x="192" y="434" font-size="15" fill="#a89f96">Run full user flows</text>

      <rect x="332" y="346" width="240" height="104" rx="12" fill="#2a2522" stroke="#6b625a" stroke-width="2"/>
      <text x="452" y="374" font-size="14" fill="#d97757" font-weight="700">02</text>
      <text x="452" y="406" font-size="22" fill="#e8e0d8" font-weight="700">Property Tests</text>
      <text x="452" y="434" font-size="15" fill="#a89f96">Thousands of inputs</text>

      <rect x="592" y="346" width="240" height="104" rx="12" fill="#2a2522" stroke="#6b625a" stroke-width="2"/>
      <text x="712" y="374" font-size="14" fill="#d97757" font-weight="700">03</text>
      <text x="712" y="406" font-size="22" fill="#e8e0d8" font-weight="700">Differential Tests</text>
      <text x="712" y="434" font-size="15" fill="#a89f96">Old system as oracle</text>

      <line x1="842" y1="398" x2="872" y2="398" stroke="#d97757" stroke-width="3"/>
      <polygon points="872,390 886,398 872,406" fill="#d97757"/>

      <rect x="892" y="346" width="230" height="104" rx="12" fill="#d97757" stroke="#d97757" stroke-width="2"/>
      <text x="1007" y="374" font-size="14" fill="#1c1917" font-weight="700">OUTPUT</text>
      <text x="1007" y="406" font-size="22" fill="#1c1917" font-weight="700">Evidence</text>
      <text x="1007" y="434" font-size="15" fill="#1c1917">Review proof, not diffs</text>
    </g>

    <!-- principle under the row -->
    <rect x="72" y="474" width="1050" height="48" rx="10" fill="none" stroke="#d97757" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="597" y="505" font-size="18" fill="#e8a587" text-anchor="middle">A change can never edit the check that judges it: review rules load from the base branch</text>

    <text x="72" y="600" font-size="17" fill="#a89f96">Claude writes and reviews ~90% of the Claude Code team's code</text>
    <text x="1128" y="600" font-size="17" fill="#a89f96" text-anchor="end">How the Claude Code team thinks about verification</text>
  </g>
</svg>
