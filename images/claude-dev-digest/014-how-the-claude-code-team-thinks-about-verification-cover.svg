<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d">
  <title id="t">Claude Code 팀의 검증 방식</title>
  <desc id="d">E2E 테스트, 속성 테스트, 차등 테스트가 증거를 만들고 사람은 diff 대신 그 증거를 검토하며, 변경은 자기를 판정하는 검사를 고칠 수 없다는 원칙</desc>
  <rect width="1200" height="630" fill="#1c1917"/>
  <rect x="0" y="0" width="12" height="630" fill="#d97757"/>
  <g font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">
    <text x="72" y="78" font-size="24" fill="#d97757" font-weight="700">Claude Dev 노트 / 014</text>
    <text x="72" y="168" font-size="56" fill="#faf6f1" font-weight="700">에이전트가 한 일을</text>
    <text x="72" y="238" font-size="56" fill="#faf6f1" font-weight="700">증거로 검증하는 법</text>
    <text x="72" y="294" font-size="28" fill="#d97757" font-weight="700">E2E, 속성, 차등 테스트에 검사기 관리까지</text>

    <!-- three test boxes (240 wide, 20 gap) + arrow + evidence box -->
    <g text-anchor="middle">
      <rect x="72" y="346" width="240" height="104" rx="12" fill="#2a2522" stroke="#6b625a" stroke-width="2"/>
      <text x="192" y="374" font-size="14" fill="#d97757" font-weight="700">01</text>
      <text x="192" y="406" font-size="23" fill="#e8e0d8" font-weight="700">E2E 테스트</text>
      <text x="192" y="434" font-size="15" fill="#a89f96">사용자 흐름을 끝까지 실행</text>

      <rect x="332" y="346" width="240" height="104" rx="12" fill="#2a2522" stroke="#6b625a" stroke-width="2"/>
      <text x="452" y="374" font-size="14" fill="#d97757" font-weight="700">02</text>
      <text x="452" y="406" font-size="23" fill="#e8e0d8" font-weight="700">속성 테스트</text>
      <text x="452" y="434" font-size="15" fill="#a89f96">입력 수천 개로 성질을 반박</text>

      <rect x="592" y="346" width="240" height="104" rx="12" fill="#2a2522" stroke="#6b625a" stroke-width="2"/>
      <text x="712" y="374" font-size="14" fill="#d97757" font-weight="700">03</text>
      <text x="712" y="406" font-size="23" fill="#e8e0d8" font-weight="700">차등 테스트</text>
      <text x="712" y="434" font-size="15" fill="#a89f96">옛 시스템이 정답지</text>

      <line x1="842" y1="398" x2="872" y2="398" stroke="#d97757" stroke-width="3"/>
      <polygon points="872,390 886,398 872,406" fill="#d97757"/>

      <rect x="892" y="346" width="230" height="104" rx="12" fill="#d97757" stroke="#d97757" stroke-width="2"/>
      <text x="1007" y="374" font-size="14" fill="#1c1917" font-weight="700">결과</text>
      <text x="1007" y="406" font-size="23" fill="#1c1917" font-weight="700">증거</text>
      <text x="1007" y="434" font-size="14" fill="#1c1917">사람은 diff 대신 증거를 검토</text>
    </g>

    <!-- principle under the row -->
    <rect x="72" y="474" width="1050" height="48" rx="10" fill="none" stroke="#d97757" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="597" y="505" font-size="19" fill="#e8a587" text-anchor="middle">변경은 자기를 판정하는 검사를 고칠 수 없다: 리뷰 규칙은 base 브랜치에서 읽는다</text>

    <text x="72" y="600" font-size="18" fill="#a89f96">Claude Code 팀 코드의 약 90%를 Claude가 쓰고 리뷰</text>
    <text x="1128" y="600" font-size="18" fill="#a89f96" text-anchor="end">How the Claude Code team thinks about verification</text>
  </g>
</svg>
