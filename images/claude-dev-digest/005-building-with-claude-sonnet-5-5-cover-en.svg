<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="When to Choose Claude Sonnet 5.5: bar chart comparing input and output token prices per million tokens between Sonnet 5.5 and Opus 5.5">
  <rect width="1200" height="630" fill="#1c1917"/>
  <rect x="0" y="0" width="12" height="630" fill="#d97757"/>
  <g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
    <text x="60" y="90" font-size="24" font-weight="700" fill="#d97757">claude.dev Digest · 005</text>
    <text x="60" y="210" font-size="48" font-weight="700" fill="#fafaf9">When to Choose</text>
    <text x="60" y="274" font-size="48" font-weight="700" fill="#fafaf9">Claude Sonnet 5.5</text>
    <text x="60" y="335" font-size="22" fill="#d6d3d1">Opus comparison and API settings to check first</text>
    <text x="60" y="385" font-size="22" fill="#a8a29e">Building with Claude Sonnet 5.5</text>

    <rect x="60" y="470" width="290" height="56" rx="28" fill="#292524" stroke="#d97757" stroke-width="2"/>
    <text x="205" y="505" font-size="19" font-weight="700" fill="#fafaf9" text-anchor="middle">30% faster than Sonnet 5</text>
    <rect x="370" y="470" width="270" height="56" rx="28" fill="#292524" stroke="#d97757" stroke-width="2"/>
    <text x="505" y="505" font-size="19" font-weight="700" fill="#fafaf9" text-anchor="middle">Up to 30% lower cost</text>

    <!-- right panel: price per million tokens, 17 px per USD -->
    <rect x="690" y="70" width="460" height="490" rx="20" fill="#292524"/>
    <text x="720" y="125" font-size="24" font-weight="700" fill="#fafaf9">Price per 1M tokens</text>
    <rect x="720" y="150" width="18" height="18" rx="3" fill="#d97757"/>
    <text x="746" y="166" font-size="20" fill="#d6d3d1">Sonnet 5.5</text>
    <rect x="880" y="150" width="18" height="18" rx="3" fill="#a8a29e"/>
    <text x="906" y="166" font-size="20" fill="#d6d3d1">Opus 5.5</text>

    <text x="720" y="225" font-size="22" font-weight="700" fill="#fafaf9">Input</text>
    <rect x="720" y="240" width="34" height="32" rx="3" fill="#d97757"/>
    <text x="764" y="264" font-size="22" font-weight="700" fill="#fafaf9">$2</text>
    <rect x="720" y="280" width="68" height="32" rx="3" fill="#a8a29e"/>
    <text x="798" y="304" font-size="22" font-weight="700" fill="#fafaf9">$4</text>

    <text x="720" y="375" font-size="22" font-weight="700" fill="#fafaf9">Output</text>
    <rect x="720" y="390" width="170" height="32" rx="3" fill="#d97757"/>
    <text x="900" y="414" font-size="22" font-weight="700" fill="#fafaf9">$10</text>
    <rect x="720" y="430" width="340" height="32" rx="3" fill="#a8a29e"/>
    <text x="1070" y="454" font-size="22" font-weight="700" fill="#fafaf9">$20</text>

    <text x="720" y="522" font-size="18" fill="#a8a29e">Longer bars indicate higher cost</text>
  </g>
</svg>
