<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-labelledby="t d">
  <title id="t">컨텍스트 창 사용률과 Token Weather 날씨 단계</title>
  <desc id="d">200k 창 기준 세 시점의 사용률은 18퍼센트 Clear, 67퍼센트 Showers, 81퍼센트 Storm이며, 날씨 단계는 25, 50, 75, 90퍼센트에서 바뀝니다.</desc>
  <rect x="0.5" y="0.5" width="999" height="439" rx="14" fill="#faf8f5" stroke="#d9d2c9"/>
  <g font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif" fill="#3a2a22">
    <text x="40" y="46" font-size="24" font-weight="700">컨텍스트 창 사용률과 날씨 단계</text>
    <text x="40" y="72" font-size="15" fill="#6b625a">200k 창 기준, 원문 실제 세션의 세 시점 (막대 길이는 사용률에 비례)</text>

    <!-- plot: x 200..900, 7px per 1% -->
    <rect x="200" y="112" width="175" height="248" fill="#fbf1cf"/>
    <rect x="375" y="112" width="175" height="248" fill="#dcf0f4"/>
    <rect x="550" y="112" width="175" height="248" fill="#dfe8fb"/>
    <rect x="725" y="112" width="105" height="248" fill="#f2e1f6"/>
    <rect x="830" y="112" width="70" height="248" fill="#fbdcd9"/>

    <g font-size="14" font-weight="700" text-anchor="middle">
      <text x="287.5" y="104">Clear</text>
      <text x="462.5" y="104">Cloudy</text>
      <text x="637.5" y="104">Showers</text>
      <text x="777.5" y="104">Storm</text>
      <text x="865" y="104">Compact soon</text>
    </g>

    <!-- axis ticks -->
    <g stroke="#6b625a" stroke-width="1">
      <line x1="200" y1="360" x2="900" y2="360"/>
      <line x1="200" y1="360" x2="200" y2="366"/>
      <line x1="375" y1="360" x2="375" y2="366"/>
      <line x1="550" y1="360" x2="550" y2="366"/>
      <line x1="725" y1="360" x2="725" y2="366"/>
      <line x1="830" y1="360" x2="830" y2="366"/>
      <line x1="900" y1="360" x2="900" y2="366"/>
    </g>
    <g stroke="#b8aea3" stroke-width="1" stroke-dasharray="4 4">
      <line x1="375" y1="112" x2="375" y2="360"/>
      <line x1="550" y1="112" x2="550" y2="360"/>
      <line x1="725" y1="112" x2="725" y2="360"/>
      <line x1="830" y1="112" x2="830" y2="360"/>
    </g>
    <g font-size="14" fill="#6b625a" text-anchor="middle">
      <text x="200" y="384">0%</text>
      <text x="375" y="384">25%</text>
      <text x="550" y="384">50%</text>
      <text x="725" y="384">75%</text>
      <text x="830" y="384">90%</text>
      <text x="900" y="384">100%</text>
    </g>
    <text x="550" y="420" font-size="14" fill="#6b625a" text-anchor="middle">컨텍스트 창 사용률 (200k 창 대비)</text>

    <!-- bars -->
    <g font-size="17" text-anchor="end">
      <text x="184" y="173" font-weight="700">첫 시점</text>
      <text x="184" y="253" font-weight="700">둘째 시점</text>
      <text x="184" y="333" font-weight="700">셋째 시점</text>
    </g>
    <rect x="200" y="146" width="126" height="40" rx="3" fill="#d9a21b"/>
    <rect x="200" y="226" width="469" height="40" rx="3" fill="#3f6fd8"/>
    <rect x="200" y="306" width="567" height="40" rx="3" fill="#a447bd"/>
    <g font-size="17" font-weight="700">
      <text x="334" y="173">18%  Clear</text>
      <text x="677" y="253">67%  Showers</text>
      <text x="775" y="333">81%  Storm</text>
    </g>
  </g>
</svg>
