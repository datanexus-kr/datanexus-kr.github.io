<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d">
  <title id="t">Hand the Work After a PR Over to Claude Code</title>
  <desc id="d">Finding and fixing issues, rule files for repeated feedback, and the merge decision, with the approval policy trialed in observe mode first</desc>
  <rect width="1200" height="630" fill="#1c1917"/>
  <rect x="0" y="0" width="12" height="630" fill="#d97757"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text x="72" y="78" font-size="24" fill="#d97757" font-weight="700">Claude Dev Notes / 016</text>
    <text x="72" y="168" font-size="50" fill="#faf6f1" font-weight="700">Hand the Work After a PR</text>
    <text x="72" y="238" font-size="50" fill="#faf6f1" font-weight="700">Over to Claude Code</text>
    <text x="72" y="294" font-size="27" fill="#d97757" font-weight="700">Find, Fix, and Decide with Claude Ship</text>

    <!-- 4 stages: width 240, gap 30 -> 72..1122 -->
    <g font-size="19" font-weight="700" text-anchor="middle">
      <rect x="72" y="350" width="240" height="96" rx="12" fill="#2a2522" stroke="#6b625a" stroke-width="2"/>
      <text x="192" y="392" fill="#e8e0d8">Find Issues</text>
      <text x="192" y="424" font-size="14.5" fill="#a89f96" font-weight="400">/code-review</text>

      <rect x="342" y="350" width="240" height="96" rx="12" fill="#2a2522" stroke="#6b625a" stroke-width="2"/>
      <text x="462" y="392" fill="#e8e0d8">Fix Issues</text>
      <text x="462" y="424" font-size="14.5" fill="#a89f96" font-weight="400">/ship, /steward watch</text>

      <rect x="612" y="350" width="240" height="96" rx="12" fill="#2a2522" stroke="#6b625a" stroke-width="2"/>
      <text x="732" y="392" fill="#e8e0d8">Rule Files</text>
      <text x="732" y="424" font-size="14.5" fill="#a89f96" font-weight="400">CLAUDE.md, REVIEW.md, skills</text>

      <rect x="882" y="350" width="240" height="96" rx="12" fill="#d97757" stroke="#d97757" stroke-width="2"/>
      <text x="1002" y="392" fill="#1c1917">Merge Decision</text>
      <text x="1002" y="424" font-size="14.5" fill="#1c1917" font-weight="400">approvals.yml</text>
    </g>

    <!-- arrows between stages -->
    <g fill="#d97757">
      <path d="M319 389 L333 398 L319 407 Z"/>
      <path d="M589 389 L603 398 L589 407 Z"/>
      <path d="M859 389 L873 398 L859 407 Z"/>
    </g>

    <!-- observe mode note under the stages -->
    <rect x="72" y="472" width="1050" height="48" rx="10" fill="none" stroke="#d97757" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="597" y="503" font-size="18" fill="#e8a587" text-anchor="middle">Trial the approval policy in observe mode, compare with reviewers, then enforce</text>

    <text x="72" y="604" font-size="17" fill="#a89f96">Watch up to 7 days / At most 3 pushes per issue</text>
    <text x="1128" y="604" font-size="17" fill="#a89f96" text-anchor="end">A practical guide to shipping with Claude Code</text>
  </g>
</svg>
