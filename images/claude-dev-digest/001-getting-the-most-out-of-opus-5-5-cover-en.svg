<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Single-pass task pipeline with completion criteria checkpoints and a stop-and-ask branch">
  <rect width="1200" height="630" fill="#1c1917"/>
  <rect x="0" y="0" width="12" height="630" fill="#d97757"/>

  <!-- Badge -->
  <text x="64" y="84" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="24" fill="#d97757">claude.dev Digest · 001</text>

  <!-- Phrase to drop -->
  <rect x="860" y="44" width="276" height="52" rx="26" fill="#292524" stroke="#57534e" stroke-width="2"/>
  <text x="998" y="79" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="26" fill="#a8a29e">think carefully</text>
  <line x1="884" y1="70" x2="1112" y2="70" stroke="#d97757" stroke-width="3"/>
  <text x="1136" y="124" text-anchor="end" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="18" fill="#a8a29e">Drop from prompts</text>

  <!-- Title -->
  <text x="64" y="156" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="34" fill="#e7e5e4">Delegating Work to Opus 5.5</text>
  <text x="64" y="230" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="56" font-weight="700" fill="#ffffff">Start with Completion Criteria</text>
  <text x="64" y="278" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="22" fill="#a8a29e">Getting the most out of Opus 5.5 in Claude and Claude Code</text>

  <!-- Path -->
  <line x1="120" y1="440" x2="1090" y2="440" stroke="#57534e" stroke-width="6" stroke-linecap="round"/>
  <line x1="120" y1="440" x2="1090" y2="440" stroke="#d97757" stroke-width="3" stroke-dasharray="2 14" stroke-linecap="round"/>

  <!-- Start -->
  <circle cx="120" cy="440" r="22" fill="#d97757"/>
  <text x="120" y="390" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="20" fill="#e7e5e4">Send full task</text>
  <text x="120" y="498" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="20" fill="#e7e5e4">State completion</text>
  <text x="120" y="524" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="20" fill="#e7e5e4">criteria upfront</text>

  <!-- Checkpoint 1 -->
  <circle cx="390" cy="440" r="30" fill="#1c1917" stroke="#d97757" stroke-width="4"/>
  <polyline points="376,441 386,451 405,429" fill="none" stroke="#d97757" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="390" y="498" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="20" fill="#e7e5e4">Migrate all endpoints</text>
  <text x="390" y="524" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="20" fill="#e7e5e4">to the new client</text>

  <!-- Checkpoint 2 -->
  <circle cx="640" cy="440" r="30" fill="#1c1917" stroke="#d97757" stroke-width="4"/>
  <polyline points="626,441 636,451 655,429" fill="none" stroke="#d97757" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="640" y="498" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="20" fill="#e7e5e4">Remove legacy</text>
  <text x="640" y="524" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="20" fill="#e7e5e4">client code</text>

  <!-- Stop condition -->
  <polygon points="765,414 791,440 765,466 739,440" fill="#f5b041" stroke="#1c1917" stroke-width="3"/>
  <text x="765" y="354" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="20" fill="#f5b041">Unexplained test failure?</text>
  <text x="765" y="382" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="20" fill="#f5b041">Stop and ask</text>

  <!-- Checkpoint 3 -->
  <circle cx="890" cy="440" r="30" fill="#1c1917" stroke="#d97757" stroke-width="4"/>
  <polyline points="876,441 886,451 905,429" fill="none" stroke="#d97757" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="890" y="498" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="20" fill="#e7e5e4">Pass test suite</text>

  <!-- Done -->
  <circle cx="1090" cy="440" r="34" fill="#d97757"/>
  <polyline points="1074,441 1086,453 1108,427" fill="none" stroke="#1c1917" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1090" y="500" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="22" font-weight="700" fill="#ffffff">Done</text>
</svg>
