<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d">
  <title id="t">Code Review on the Claude Code Team</title>
  <desc id="d">Six layers of verification from pre-PR checks and required CI through AI review, security review, risk-based human approval, and merge queue with flags, backed by fast rollback</desc>
  <rect width="1200" height="630" fill="#1c1917"/>
  <rect x="0" y="0" width="12" height="630" fill="#d97757"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text x="72" y="78" font-size="24" fill="#d97757" font-weight="700">claude.dev Digest · 010</text>
    <text x="72" y="168" font-size="50" fill="#faf6f1" font-weight="700">Reviewing Agent-Written Code</text>
    <text x="72" y="238" font-size="50" fill="#faf6f1" font-weight="700">Across Six Verification Layers</text>
    <text x="72" y="294" font-size="27" fill="#d97757" font-weight="700">Six Check Layers · Risk-Based Approval · Fast Rollback</text>

    <!-- 6 layers: width 160, gap 18 -> 72..1122 -->
    <g font-size="17" font-weight="700" text-anchor="middle">
      <rect x="72" y="350" width="160" height="96" rx="12" fill="#2a2522" stroke="#6b625a" stroke-width="2"/>
      <text x="152" y="392" fill="#e8e0d8">Pre-PR Checks</text>
      <text x="152" y="424" font-size="13.5" fill="#a89f96" font-weight="400">Prove with output</text>

      <rect x="250" y="350" width="160" height="96" rx="12" fill="#2a2522" stroke="#6b625a" stroke-width="2"/>
      <text x="330" y="392" fill="#e8e0d8">Required CI</text>
      <text x="330" y="424" font-size="13.5" fill="#a89f96" font-weight="400">Lint · type · test</text>

      <rect x="428" y="350" width="160" height="96" rx="12" fill="#2a2522" stroke="#6b625a" stroke-width="2"/>
      <text x="508" y="392" fill="#e8e0d8">AI Review</text>
      <text x="508" y="424" font-size="13.5" fill="#a89f96" font-weight="400">Vote-filtered bugs</text>

      <rect x="606" y="350" width="160" height="96" rx="12" fill="#2a2522" stroke="#6b625a" stroke-width="2"/>
      <text x="686" y="392" fill="#e8e0d8">Security</text>
      <text x="686" y="424" font-size="13.5" fill="#a89f96" font-weight="400">Open issues block</text>

      <rect x="784" y="350" width="160" height="96" rx="12" fill="#d97757" stroke="#d97757" stroke-width="2"/>
      <text x="864" y="392" fill="#1c1917">Risk Approval</text>
      <text x="864" y="424" font-size="13.5" fill="#1c1917" font-weight="400">0 · 1 · 2 humans</text>

      <rect x="962" y="350" width="160" height="96" rx="12" fill="#2a2522" stroke="#6b625a" stroke-width="2"/>
      <text x="1042" y="392" fill="#e8e0d8">Queue · Flags</text>
      <text x="1042" y="424" font-size="13.5" fill="#a89f96" font-weight="400">Re-test on main</text>
    </g>

    <!-- rollback under the layers -->
    <rect x="72" y="472" width="1050" height="48" rx="10" fill="none" stroke="#d97757" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="597" y="503" font-size="18" fill="#e8a587" text-anchor="middle">Issues that slip through are contained quickly via flag kills and reverts</text>

    <text x="72" y="604" font-size="17" fill="#a89f96">Jun–Sep merged PRs &gt;2x · Revert rate down &gt;40%</text>
    <text x="1128" y="604" font-size="17" fill="#a89f96" text-anchor="end">How the Claude Code team does code review</text>
  </g>
</svg>
