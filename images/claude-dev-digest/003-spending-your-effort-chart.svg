  <rect x="250" y="306" width="438" height="24" fill="#d97757"/>
  <text x="698" y="325" font-size="18" font-weight="700" fill="#fafaf9">73%</text>
  <text x="40" y="372" font-size="22" font-weight="700" fill="#fafaf9">Science</text>
  <text x="40" y="396" font-size="16" fill="#a8a29e">과제 15개</text>
  <rect x="250" y="350" width="246" height="24" fill="#78716c"/>
  <text x="506" y="369" font-size="18" fill="#d6d3d1">41%</text>
  <rect x="250" y="378" width="366" height="24" fill="#d97757"/>
  <text x="626" y="397" font-size="18" font-weight="700" fill="#fafaf9">61%</text>
  <text x="40" y="444" font-size="22" font-weight="700" fill="#fafaf9">Software</text>
