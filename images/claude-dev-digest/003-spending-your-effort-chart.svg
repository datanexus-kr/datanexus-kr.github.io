  <text x="40" y="540" font-size="16" fill="#a8a29e">과제 4개</text>
  <rect x="250" y="494" width="108" height="24" fill="#78716c"/>
  <text x="368" y="513" font-size="18" fill="#d6d3d1">18%</text>
  <rect x="250" y="522" width="180" height="24" fill="#d97757"/>
  <text x="440" y="541" font-size="18" font-weight="700" fill="#fafaf9">30%</text>
  <text x="40" y="588" font-size="22" font-weight="700" fill="#fafaf9">Operations</text>
  <text x="40" y="612" font-size="16" fill="#a8a29e">과제 10개</text>
  <rect x="250" y="566" width="72" height="24" fill="#78716c"/>
