  <line x1="550" y1="120" x2="550" y2="640" stroke="#44403c" stroke-width="1"/>
  <text x="550" y="114" font-size="16" fill="#a8a29e" text-anchor="middle">50%</text>
  <line x1="700" y1="120" x2="700" y2="640" stroke="#44403c" stroke-width="1"/>
  <text x="700" y="114" font-size="16" fill="#a8a29e" text-anchor="middle">75%</text>
  <line x1="850" y1="120" x2="850" y2="640" stroke="#44403c" stroke-width="1"/>
  <text x="850" y="114" font-size="16" fill="#a8a29e" text-anchor="middle">100%</text>
  <text x="40" y="156" font-size="22" font-weight="700" fill="#fafaf9">Security</text>
  <text x="40" y="180" font-size="16" fill="#a8a29e">과제 7개</text>
  <rect x="250" y="134" width="384" height="24" fill="#78716c"/>
