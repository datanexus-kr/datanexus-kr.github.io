  <rect x="250" y="594" width="132" height="24" fill="#d97757"/>
  <text x="392" y="613" font-size="18" font-weight="700" fill="#fafaf9">22%</text>
  <text x="40" y="668" font-size="15" fill="#a8a29e">low 는 모델별 가장 낮은 두 설정, 최상위는 가장 높은 세 설정을 합산한 값입니다. 분야마다 과제 수가 적어서 그렇게 묶었습니다.</text>
  <text x="40" y="688" font-size="15" fill="#a8a29e">Terminal-Bench 3.0, 내부 실행 기준이라 공개 리더보드와 다를 수 있습니다.</text>
