  <text x="66" y="91" font-size="18" fill="#d6d3d1">low effort</text>
  <rect x="180" y="76" width="18" height="18" fill="#d97757"/>
  <text x="206" y="91" font-size="18" fill="#d6d3d1">최상위 effort</text>
  <line x1="250" y1="120" x2="250" y2="640" stroke="#44403c" stroke-width="1"/>
  <text x="250" y="114" font-size="16" fill="#a8a29e" text-anchor="middle">0%</text>
  <line x1="400" y1="120" x2="400" y2="640" stroke="#44403c" stroke-width="1"/>
