<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" role="img" aria-labelledby="t d" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">
  <title id="t">Fable 5.1 분야별 통과율: low 대 최상위 effort</title>
  <desc id="d">Terminal-Bench 3.0 분야별 통과율. Security 64%에서 87%, Hardware 34%에서 75%, ML 54%에서 73%, Science 41%에서 61%, Software 43%에서 56%, Media 18%에서 30%, Operations 12%에서 22%.</desc>
  <rect width="960" height="700" rx="16" fill="#1c1917"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#fafaf9">Fable 5.1 분야별 통과율, low 대 최상위 effort</text>
