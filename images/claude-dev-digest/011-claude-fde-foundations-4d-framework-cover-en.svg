<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d">
  <title id="t">Claude FDE Part 1: The 4D Framework and Setting Limits</title>
  <desc id="d">Cover diagram illustrating the 4D Framework (Delegation, Description, Discernment, Diligence) supported by model limits, platform surfaces, and workload-based model selection</desc>
  <rect width="1200" height="630" fill="#1c1917"/>
  <rect x="0" y="0" width="12" height="630" fill="#d97757"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text x="72" y="78" font-size="24" fill="#d97757" font-weight="700">Claude Dev Notes / 011</text>
    <text x="72" y="160" font-size="48" fill="#faf6f1" font-weight="700">How an FDE Differs from</text>
    <text x="72" y="224" font-size="48" fill="#faf6f1" font-weight="700">a Typical AI Developer</text>
    <text x="72" y="284" font-size="24" fill="#d97757" font-weight="700">4D Framework, Setting Limits, Platform Surfaces, and Model Choice</text>

    <!-- 4D cards: width 246, gap 24 -> 72..1128 -->
    <g text-anchor="middle">
      <rect x="72" y="336" width="246" height="118" rx="14" fill="#2a2522" stroke="#6b625a" stroke-width="2"/>
      <text x="195" y="370" font-size="15" fill="#d97757" font-weight="700">01</text>
      <text x="195" y="402" font-size="23" fill="#faf6f1" font-weight="700">Delegation</text>
      <text x="195" y="432" font-size="14" fill="#b8afa6">Split AI and human work</text>

      <rect x="342" y="336" width="246" height="118" rx="14" fill="#2a2522" stroke="#6b625a" stroke-width="2"/>
      <text x="465" y="370" font-size="15" fill="#d97757" font-weight="700">02</text>
      <text x="465" y="402" font-size="23" fill="#faf6f1" font-weight="700">Description</text>
      <text x="465" y="432" font-size="14" fill="#b8afa6">State goals and constraints</text>

      <rect x="612" y="336" width="246" height="118" rx="14" fill="#2a2522" stroke="#6b625a" stroke-width="2"/>
      <text x="735" y="370" font-size="15" fill="#d97757" font-weight="700">03</text>
      <text x="735" y="402" font-size="23" fill="#faf6f1" font-weight="700">Discernment</text>
      <text x="735" y="432" font-size="14" fill="#b8afa6">Verify outputs and reasoning</text>

      <rect x="882" y="336" width="246" height="118" rx="14" fill="#d97757" stroke="#d97757" stroke-width="2"/>
      <text x="1005" y="370" font-size="15" fill="#1c1917" font-weight="700">04</text>
      <text x="1005" y="402" font-size="23" fill="#1c1917" font-weight="700">Diligence</text>
