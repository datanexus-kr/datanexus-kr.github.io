    <!-- foundation bar -->
    <rect x="72" y="482" width="1056" height="54" rx="10" fill="none" stroke="#d97757" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="600" y="515" font-size="18" fill="#e8a587" text-anchor="middle">Three foundations before code: model limits, platform surfaces, and workload-based model selection</text>

    <text x="72" y="596" font-size="17" fill="#a89f96">Claude FDE Series 1/6 (Core 4 Modules)</text>
