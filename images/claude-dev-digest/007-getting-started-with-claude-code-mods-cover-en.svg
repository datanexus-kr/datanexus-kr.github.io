<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d">
  <title id="t">Extending Claude Code with Custom Mods</title>
  <desc id="d">A hook chain passing events through your handler and other plugins to Claude Code, paired with a five-stage context window usage bar from Clear to Compact soon</desc>
  <rect width="1200" height="630" fill="#1c1917"/>
  <rect x="0" y="0" width="12" height="630" fill="#d97757"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text x="72" y="78" font-size="24" fill="#d97757" font-weight="700">claude.dev Digest · 007</text>
    <text x="72" y="168" font-size="54" fill="#faf6f1" font-weight="700">Extending Claude Code</text>
    <text x="72" y="238" font-size="54" fill="#faf6f1" font-weight="700">with Custom Mods</text>
    <text x="72" y="298" font-size="32" fill="#d97757" font-weight="700">Live Context Usage · Risky Command Checks</text>

    <!-- hook chain -->
    <g font-size="24" font-weight="700" text-anchor="middle">
      <rect x="72" y="345" width="190" height="70" rx="12" fill="#2a2522" stroke="#6b625a" stroke-width="2"/>
      <text x="167" y="389" fill="#e8e0d8">Event</text>
      <path d="M268 380 H312 M302 372 L312 380 L302 388" fill="none" stroke="#a89f96" stroke-width="3"/>
      <rect x="318" y="345" width="190" height="70" rx="12" fill="#d97757" stroke="#d97757" stroke-width="2"/>
      <text x="413" y="389" fill="#1c1917">Your Hook</text>
      <path d="M514 380 H558 M548 372 L558 380 L548 388" fill="none" stroke="#a89f96" stroke-width="3"/>
      <rect x="564" y="345" width="250" height="70" rx="12" fill="#2a2522" stroke="#6b625a" stroke-width="2"/>
      <text x="689" y="389" fill="#e8e0d8">Other Plugins</text>
      <path d="M820 380 H864 M854 372 L864 380 L854 388" fill="none" stroke="#a89f96" stroke-width="3"/>
      <rect x="870" y="345" width="258" height="70" rx="12" fill="#2a2522" stroke="#6b625a" stroke-width="2"/>
      <text x="999" y="389" fill="#e8e0d8">Claude Code</text>
    </g>

    <!-- context gauge: 72..1128 = 1056px = 100% -->
    <text x="72" y="466" font-size="20" fill="#a89f96">Token Weather · Context window fill level</text>
    <rect x="72" y="480" width="264" height="32" fill="#e5b94a"/>
    <rect x="336" y="480" width="264" height="32" fill="#5fb8c9"/>
    <rect x="600" y="480" width="264" height="32" fill="#5b8def"/>
    <rect x="864" y="480" width="158.4" height="32" fill="#c26bd6"/>
    <rect x="1022.4" y="480" width="105.6" height="32" fill="#e5534b"/>
    <g font-size="20" font-weight="700" text-anchor="middle">
      <text x="204" y="544" fill="#e5b94a">Clear</text>
      <text x="468" y="544" fill="#5fb8c9">Cloudy</text>
      <text x="732" y="544" fill="#8aa9f5">Showers</text>
      <text x="943" y="544" fill="#d98be9">Storm</text>
      <text x="1075" y="544" fill="#ef7d76" font-size="14">Compact soon</text>
    </g>
    <g font-size="16" fill="#a89f96" text-anchor="middle">
      <text x="336" y="570">25%</text>
      <text x="600" y="570">50%</text>
      <text x="864" y="570">75%</text>
      <text x="1022" y="570">90%</text>
    </g>
    <text x="1128" y="604" font-size="20" fill="#a89f96" text-anchor="end">Getting started with Claude Code mods</text>
  </g>
</svg>
