<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Sonnet 5.5와 Opus 5.5의 100만 토큰당 입력, 출력 가격 비교 막대">
  <rect width="1200" height="630" fill="#1c1917"/>
  <rect x="0" y="0" width="12" height="630" fill="#d97757"/>
  <g font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">
    <text x="60" y="90" font-size="24" font-weight="700" fill="#d97757">claude.dev 다이제스트 · 005</text>
    <text x="60" y="210" font-size="50" font-weight="700" fill="#fafaf9">Sonnet 5.5,</text>
    <text x="60" y="275" font-size="50" font-weight="700" fill="#fafaf9">언제 쓰면 좋을까요?</text>
    <text x="60" y="335" font-size="24" fill="#d6d3d1">Opus와 비교하고, 바꾸기 전 확인할 설정</text>
    <text x="60" y="385" font-size="22" fill="#a8a29e">Building with Claude Sonnet 5.5</text>

    <rect x="60" y="470" width="290" height="56" rx="28" fill="#292524" stroke="#d97757" stroke-width="2"/>
    <text x="205" y="506" font-size="22" font-weight="700" fill="#fafaf9" text-anchor="middle">Sonnet 5보다 30% 빠름</text>
    <rect x="370" y="470" width="270" height="56" rx="28" fill="#292524" stroke="#d97757" stroke-width="2"/>
    <text x="505" y="506" font-size="22" font-weight="700" fill="#fafaf9" text-anchor="middle">최대 30% 비용 절감</text>

    <!-- right panel: price per million tokens, 17 px per USD -->
    <rect x="690" y="70" width="460" height="490" rx="20" fill="#292524"/>
    <text x="720" y="125" font-size="24" font-weight="700" fill="#fafaf9">100만 토큰당 가격</text>
    <rect x="720" y="150" width="18" height="18" rx="3" fill="#d97757"/>
    <text x="746" y="166" font-size="20" fill="#d6d3d1">Sonnet 5.5</text>
    <rect x="880" y="150" width="18" height="18" rx="3" fill="#a8a29e"/>
    <text x="906" y="166" font-size="20" fill="#d6d3d1">Opus 5.5</text>

    <text x="720" y="225" font-size="22" font-weight="700" fill="#fafaf9">입력</text>
    <rect x="720" y="240" width="34" height="32" rx="3" fill="#d97757"/>
    <text x="764" y="264" font-size="22" font-weight="700" fill="#fafaf9">$2</text>
    <rect x="720" y="280" width="68" height="32" rx="3" fill="#a8a29e"/>
    <text x="798" y="304" font-size="22" font-weight="700" fill="#fafaf9">$4</text>

    <text x="720" y="375" font-size="22" font-weight="700" fill="#fafaf9">출력</text>
    <rect x="720" y="390" width="170" height="32" rx="3" fill="#d97757"/>
    <text x="900" y="414" font-size="22" font-weight="700" fill="#fafaf9">$10</text>
    <rect x="720" y="430" width="340" height="32" rx="3" fill="#a8a29e"/>
    <text x="1070" y="454" font-size="22" font-weight="700" fill="#fafaf9">$20</text>

    <text x="720" y="522" font-size="18" fill="#a8a29e">막대가 길수록 비용이 큽니다</text>
  </g>
</svg>
